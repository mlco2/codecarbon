name: Resolve review 1277

on:
  push:
    branches:
      - fix/api-client-raise-for-status-820

permissions:
  contents: write

jobs:
  apply-review-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/api-client-raise-for-status-820

      - name: Remove unnecessary initialization guard and synthetic test
        run: |
          python - <<'PY'
          from pathlib import Path

          tracker_path = Path("codecarbon/emissions_tracker.py")
          tracker = tracker_path.read_text()
          old = '''        if OutputMethod.API in methods:
              try:
                  cc_api__out = CodeCarbonAPIOutput(
                      endpoint_url=self._api_endpoint,
                      experiment_id=self._experiment_id,
                      api_key=api_key,
                      conf=self._conf,
                  )
                  self.run_id = cc_api__out.run_id
                  self._output_handlers.append(cc_api__out)
              except Exception as e:
                  logger.error(
                      "Failed to initialize Code Carbon API output; "
                      "continuing without API reporting. %s",
                      e,
                      exc_info=True,
                  )
                  self.run_id = uuid.uuid4()
          else:
              self.run_id = uuid.uuid4()
          '''
          new = '''        if OutputMethod.API in methods:
              cc_api__out = CodeCarbonAPIOutput(
                  endpoint_url=self._api_endpoint,
                  experiment_id=self._experiment_id,
                  api_key=api_key,
                  conf=self._conf,
              )
              self.run_id = cc_api__out.run_id
              self._output_handlers.append(cc_api__out)
          else:
              self.run_id = uuid.uuid4()
          '''
          if old not in tracker:
              raise SystemExit("Expected emissions_tracker block not found")
          tracker_path.write_text(tracker.replace(old, new, 1))

          tests_path = Path("tests/test_emissions_tracker.py")
          tests = tests_path.read_text()
          start = tests.index("    def test_api_output_init_failure_does_not_break_tracker(\n")
          end = tests.index("    def test_output_methods_parsed_from_config_string(\n", start)
          tests_path.write_text(tests[:start] + tests[end:])
          PY

      - name: Verify Python syntax
        run: python -m compileall -q codecarbon/emissions_tracker.py tests/test_emissions_tracker.py

      - name: Amend branch without workflow file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/resolve-review-1277.yml
          git add codecarbon/emissions_tracker.py tests/test_emissions_tracker.py .github/workflows/resolve-review-1277.yml
          git commit --amend -m "fix: remove unnecessary API output init guard"
          git push --force-with-lease origin HEAD:fix/api-client-raise-for-status-820
