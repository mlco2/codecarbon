name: Deploy to Clever Cloud

on:
  push:
    paths:
      - "carbonserver/**"
      - "webapp/**"
      - "pyproject.toml"
    branches: [master]

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0 # Same as git fetch --unshallow
        clean: true    # Remove any untracked files or modifications

    - name: Deploy to Clever Cloud (PROD)
      uses: $/.github/actions/deploy-clever-cloud
      with:
        clever-token: ${{ secrets.CLEVER_TOKEN }}
        clever-secret: ${{ secrets.CLEVER_SECRET }}
        backend-app-id: ${{ secrets.BE_CLEVER_APP_ID_PROD }}
        frontend-app-id: ${{ secrets.FE_CLEVER_APP_ID_PROD }}
        frontend-app-alias: ${{ secrets.FE_CLEVER_APP_ALIAS_PROD }}
