name: build ui

on:
    pull_request:
        paths:
            - "webapp/**"
            - "pyproject.toml"
    push:
        paths:
            - "webapp/**"
            - "pyproject.toml"
        branches: [master]

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
    build-ui:
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
            # Installs the pnpm version pinned in package.json's packageManager.
              with:
                persist-credentials: false
            - name: Use pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  package_json_file: webapp/package.json
            - name: Use Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "${{ env.NODE_VERSION }}"
                  cache: "pnpm"
                  cache-dependency-path: webapp/pnpm-lock.yaml
            - name: Install dependencies
              working-directory: ./webapp
              run: pnpm install --frozen-lockfile
            - name: Build
              working-directory: ./webapp
              run: pnpm run build
            - name: Unit tests (vitest)
              working-directory: ./webapp
              run: pnpm run test:run
            - name: Lint
              working-directory: ./webapp
              run: pnpm run lint
            - name: Check formatting with Prettier
              working-directory: ./webapp
              run: pnpm run format:check

    e2e-ui:
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            # Installs the pnpm version pinned in package.json's packageManager.
              with:
                persist-credentials: false
            - name: Use pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  package_json_file: webapp/package.json
            - name: Use Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "${{ env.NODE_VERSION }}"
                  cache: "pnpm"
                  cache-dependency-path: webapp/pnpm-lock.yaml
            - name: Install dependencies
              working-directory: ./webapp
              run: pnpm install --frozen-lockfile
            - name: Install Playwright browsers
              working-directory: ./webapp
              run: pnpm exec playwright install --with-deps chromium
            - name: Run Playwright tests (mock mode, no backend)
              working-directory: ./webapp
              run: pnpm run test:e2e
            - name: Upload Playwright report
              if: failure()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: playwright-report
                  path: webapp/playwright-report
                  retention-days: 7
