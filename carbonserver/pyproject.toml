[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carbonserver"
version = "0.1.0"
requires-python = "==3.12.*"
authors = [
    { name = "DataForGood" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "alembic<2.0.0",
    # The benchmark ingestion gate imports codecarbon.benchmark.validation.
    # The validity rules are a shared contract between the harness that
    # produces records and the endpoint that accepts them; two copies of a
    # gate drift apart, so there is one implementation and both sides use it.
    "codecarbon",
    "authlib>=1.7.2",
    "bcrypt<5.0.0",
    "python-dateutil<3.0.0",
    "dependency-injector<5.0.0",
    # fastapi 0.140.5 renamed dependencies.utils.get_body_field to _get_body_field,
    # which breaks fastapi-pagination (up to 0.15.15). Lift once it is fixed upstream.
    # See https://github.com/uriyyo/fastapi-pagination/issues/1990
    "fastapi<0.140.5,>=0.138.1",
    "httpx<1.0.0",
    "pydantic[email]>=2.0.0,<3.0.0",
    "pydantic-settings>=2.14.2,<3.0.0",
    "psycopg2-binary<3.0.0",
    "requests<3.0.0",
    "sqlalchemy<2.0.0",
    "uvicorn[standard]<1.0.0",
    "fastapi-pagination<1.0.0",
    "numpy",
    "psutil",
    "rapidfuzz",
    "PyJWT",
    "authlib>=1.6.6",
    "joserfc>=1.0.0",
    "itsdangerous>=2.2.0",
    # Alembic depends on Mako but does not currently require the CVE-fixed version.
    "mako>=1.3.12",
]

[project.optional-dependencies]
dev = [
    "mock",
    "pytest",
    "pytest-asyncio",
    "responses",
    "requests-mock",
]

[project.urls]
Homepage = "https://codecarbon.io/"
Repository = "https://github.com/mlco2/codecarbon"
Dashboard = "http://dashboard.codecarbon.io/"
Documentation = "https://docs.codecarbon.io/"
Issues = "https://github.com/mlco2/codecarbon/issues"
Changelog = "https://github.com/mlco2/codecarbon/releases"

[tool.uv.sources]
# Resolve codecarbon from the sibling checkout rather than PyPI: the harness
# and the ingestion gate must agree on the validity rules, and that only holds
# if they are the same working copy.
codecarbon = { path = "..", editable = true }

[tool.hatch.build]
exclude = ["*"]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
