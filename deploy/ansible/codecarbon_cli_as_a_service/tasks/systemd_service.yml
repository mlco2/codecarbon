---
- name: Install Systemd service for CodeCarbon
  hosts: all
  vars_files:
    - "../vars/main.yml"
  become: true
  become_method: sudo

  tasks:
  - name: Create systemd service file
    template:
       src: ../templates/systemd_service.j2
       dest: /etc/systemd/system/codecarbon.service
       mode: '0644'

  - name: Enable and start CodeCarbon service
    systemd:
       name: codecarbon
       enabled: yes
       state: started
       daemon_reload: yes

  # CodeCarbon only reads .codecarbon.config at startup, so a configuration
  # change is a no-op until the service is restarted. The variable comes from
  # the previous play, registered variables are kept per host across plays.
  - name: Restart CodeCarbon to pick up the new configuration
    systemd:
       name: codecarbon
       state: restarted
    when: codecarbon_config.changed | default(false)